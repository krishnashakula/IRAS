name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-rc*"    # v1.2.3-rc1

permissions:
  contents: write      # create GitHub releases
  packages: write      # push to GHCR
  id-token: write      # OIDC for trusted publishing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Validate the tag matches the version in pyproject.toml
  # ─────────────────────────────────────────────────────────────────────────────
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag and verify pyproject.toml version
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          TOML_VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/version = "//;s/"//')

          echo "Tag version   : $VERSION"
          echo "pyproject.toml: $TOML_VERSION"

          if [[ "$VERSION" != "$TOML_VERSION"* ]]; then
            echo "ERROR: tag $TAG does not match pyproject.toml version $TOML_VERSION"
            exit 1
          fi

          IS_PRERELEASE=false
          [[ "$VERSION" == *"-rc"* ]] && IS_PRERELEASE=true

          echo "version=$VERSION"            >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # Full test suite must pass before any release artifact is produced
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Release Tests
    runs-on: ubuntu-latest
    needs: validate-version
    env:
      ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
      LANGSMITH_API_KEY: "ls-ci-placeholder"
      LOGFIRE_TOKEN: "pylf-ci-placeholder"
      SLACK_BOT_TOKEN: "xoxb-ci-placeholder"
      SLACK_ONCALL_CHANNEL_ID: "C00000TEST"
      PAGERDUTY_INTEGRATION_KEY: "pd-ci-placeholder"
      PROMETHEUS_BASE_URL: "http://localhost:9090"
      POSTGRES_URL: "postgresql://iras:secret@localhost:5432/iras"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iras
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: iras
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iras -d iras"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -e ".[dev]"

      - name: Unit + integration tests
        run: |
          python -m pytest tests/unit tests/integration \
            -q --tb=short --no-header \
            --cov=src/iras --cov-fail-under=60 \
            -p no:cacheprovider

  # ─────────────────────────────────────────────────────────────────────────────
  # Build and push multi-arch Docker image to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=IRAS
            org.opencontainers.image.description=Autonomous Incident Response Agent System
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ needs.validate-version.outputs.version }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate-version.outputs.version }}
          artifact-name: sbom-${{ needs.validate-version.outputs.version }}.spdx.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Python distribution package
  # ─────────────────────────────────────────────────────────────────────────────
  build-dist:
    name: Build Python Distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build wheel and sdist
        run: |
          pip install --upgrade pip build
          python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.validate-version.outputs.version }}
          path: dist/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Create GitHub Release with changelog and artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-version, docker, build-dist]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for changelog

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.validate-version.outputs.version }}
          path: dist/

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Previous tag: $PREV_TAG"
          CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "IRAS ${{ needs.validate-version.outputs.version }}"
          prerelease: ${{ needs.validate-version.outputs.is_prerelease }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Docker

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.validate-version.outputs.version }}
            ```

            ## Install

            ```bash
            pip install iras==${{ needs.validate-version.outputs.version }}
            ```

            ---
            **Docker image digest:** `${{ needs.docker.outputs.image_digest }}`
          files: |
            dist/*
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
